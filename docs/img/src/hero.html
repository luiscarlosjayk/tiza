<!doctype html>
<!--
  Hero image of the README and the social card (t-121 AC6/AC7).
  Rendered by scripts/readme-images.sh: a headless Chrome screenshot at
  1200×630, device scale 2 → docs/img/hero.png (2400×1260).
  The three frames are real `tiza render examples/ownership.rs.tiza --step N`
  exports, used exactly as produced. Libron (as Tiza Serif, docs/brand/fonts)
  sets the title only, never anything inside a frame.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiza hero</title>
<style>
  @font-face {
    font-family: "Tiza Serif";
    src: url("../../brand/fonts/TizaSerif-Bold.ttf") format("truetype");
    font-weight: 700 800;
    font-style: normal;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: radial-gradient(circle at 10% 10%, #1a202c 0%, #0d1117 100%);
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .brand {
    position: absolute;
    left: 80px;
    width: 470px;
    top: 50%;
    transform: translateY(-50%);
  }
  h1 {
    margin: 0 0 12px;
    font-family: "Tiza Serif", serif;
    font-size: 128px;
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 1;
  }
  .brand p {
    margin: 0;
    font-size: 30px;
    line-height: 1.4;
    color: #8b949e;
  }
  .win {
    position: absolute;
    width: 540px;
    border-radius: 12px;
    border: 1px solid #30363d;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .75);
    background: #15171b;
    overflow: hidden;
  }
  .bar {
    height: 26px;
    background: #1d2026;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .r { background: #ff5f57; }
  .y { background: #febc2e; }
  .g { background: #28c840; }
  .label {
    margin-left: auto;
    font-size: 13px;
    color: #8b949e;
  }
  .win img { display: block; width: 100%; height: auto; }
  /* The back windows are dimmed with an overlay, never by making them
     translucent, so their text does not bleed through the window in front. */
  .dim::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(13, 17, 23, .55);
  }
  .z1 { top: 40px; right: 30px; z-index: 1; }
  .z2 { top: 105px; right: 60px; z-index: 2; }
  .z3 { top: 170px; right: 90px; z-index: 3; }
</style>
</head>
<body>
  <div class="brand">
    <h1>TIZA</h1>
    <p>Step-by-step code annotations<br>for the terminal</p>
  </div>
  <div class="win z1 dim">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="label">Step 1</span></div>
    <img src="step1.png" alt="Tiza frame, step 1 of the Rust ownership example: s is born and moves into takes">
  </div>
  <div class="win z2 dim">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="label">Step 4</span></div>
    <img src="step4.png" alt="Tiza frame, step 4: the move of s, its drop inside takes and the shared borrow of t">
  </div>
  <div class="win z3">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="label">Step 7</span></div>
    <img src="step7.png" alt="Tiza frame, step 7: move, shared borrow, mutable borrow and drop annotated, with a callout that sums up">
  </div>
</body>
</html>
