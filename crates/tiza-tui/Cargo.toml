[package]
name = "tiza-tui"
description = "Internal crate of Tiza (terminal interface), published only so that `cargo install tiza` works; no stable API — use the `tiza` binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# Test-only hooks: environment variables that make a request panic on
# purpose or slow the clock and the frames, a hold of the live checks,
# the watchers and the bar message in `follow.status`, and the held
# checks in `status`. `qa`'s `bin()` builds the test binary with it, and
# the tests of `qa` turn it on as a dev-dependency for the instance in
# their own process; a release build never has it.
test-hooks = []

[dependencies]
tiza-core.workspace = true
ratatui.workspace = true
crossterm.workspace = true
notify.workspace = true
sha2.workspace = true
rustix.workspace = true
signal-hook.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true

[lints]
workspace = true
