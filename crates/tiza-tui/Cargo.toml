[package]
name = "tiza-tui"
description = "Internal crate of Tiza (terminal interface), published only so that `cargo install tiza` works; no stable API — use the `tiza` binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# Test-only hooks (t-166): environment variables that make a request
# panic on purpose or shorten the MCP export deadline. `qa`'s `bin()`
# builds the test binary with it; a release build never has it.
test-hooks = []

[dependencies]
tiza-core.workspace = true
ratatui.workspace = true
crossterm.workspace = true
notify.workspace = true
rustix.workspace = true
signal-hook.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
