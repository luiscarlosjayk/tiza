[package]
name = "tiza"
description = "Tiza: a Rust TUI to draw on top of code in the terminal and explain it on video (TUI, CLI and MCP server)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tiza"
path = "src/main.rs"

[features]
# Test-only hooks (t-166): environment variables that make a request
# panic on purpose or shorten the MCP export deadline. `qa`'s `bin()`
# builds the test binary with it; a release build never has it.
test-hooks = ["tiza-tui/test-hooks", "tiza-mcp/test-hooks"]

[dependencies]
tiza-core.workspace = true
tiza-tui.workspace = true
tiza-mcp.workspace = true
tiza-export.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true

[dev-dependencies]
unicode-width.workspace = true
