[package]
name = "tiza"
description = "Draw on top of code in your terminal to explain, debug and teach: a TUI, a CLI and an MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# crates.io page: a README of its own with absolute links (the
# repository's README links relative paths, which crates.io cannot follow),
# and the documentation on GitHub (the binary has no Rust API for docs.rs).
readme = "README.md"
homepage = "https://github.com/luiscarlosjayk/tiza"
documentation = "https://github.com/luiscarlosjayk/tiza#readme"
keywords = ["tui", "terminal", "annotation", "presentation", "mcp"]
categories = ["command-line-utilities", "development-tools", "visualization"]
# Its tests read ../../examples/, which is not in the package.
exclude = ["tests/"]

[[bin]]
name = "tiza"
path = "src/main.rs"

[features]
# Test-only hooks: environment variables that make a request
# panic on purpose or shorten the MCP export deadline, and a hold of the
# live checks. `qa`'s `bin()` builds the test binary with it; a release
# build never has it.
test-hooks = ["tiza-tui/test-hooks", "tiza-mcp/test-hooks"]

[dependencies]
tiza-core.workspace = true
tiza-tui.workspace = true
tiza-mcp.workspace = true
tiza-export.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true

[dev-dependencies]
unicode-width.workspace = true

[lints]
workspace = true
