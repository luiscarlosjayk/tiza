[package]
name = "tiza-mcp"
description = "Internal crate of Tiza (MCP server), published only so that `cargo install tiza` works; no stable API — use the `tiza` binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# Test-only hooks (t-166): environment variables that make a request
# panic on purpose or shorten the MCP export deadline. `qa`'s `bin()`
# builds the test binary with it; a release build never has it.
test-hooks = []

[dependencies]
tiza-core.workspace = true
tiza-tui.workspace = true
tiza-export.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
