# Zola config of the Tiza docs site. Zola v0.23.6.
# content/, static/img/, static/favicon.svg and release.toml are generated by build.py:
# do not edit them.
base_url = "https://tiza.luisk.dev"
title = "Tiza docs"
description = "Draw on top of code in your terminal to explain, debug and teach."
default_language = "en"
compile_sass = false
build_search_index = true
generate_feeds = false

[markdown]
github_alerts = true
# Heading anchors are added by site.js, so the search index has no "#" text.
insert_anchor_links = "none"
bottom_footnotes = true

[markdown.highlighting]
error_on_missing_language = false
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[search]
include_title = true
include_description = false
include_content = true
index_format = "elasticlunr_javascript"

[link_checker]
internal_level = "error"
external_level = "warn"
skip_prefixes = ["https://", "http://"]

[extra]
# The header line: "Docs for main. Latest release: vX.Y.Z". build.py writes the
# version into release.toml from the workspace Cargo.toml.
docs_branch = "main"
repo_url = "https://github.com/luiscarlosjayk/tiza"
# The groups of the left navigation, in order. "start" also shows the home page.
nav_sections = ["start", "guides", "concepts", "reference", "agents"]
