[workspace]
resolver = "3"
members = [
    "crates/tiza-core",
    "crates/tiza-tui",
    "crates/tiza-mcp",
    "crates/tiza-cli",
    "crates/tiza-export",
    "qa",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luiscarlosjayk/tiza"
authors = ["Luis Carlos Osorio Jayk <luiscarlosjayk@gmail.com>"]

[workspace.dependencies]
tiza-core = { path = "crates/tiza-core", version = "0.0.1" }
tiza-tui = { path = "crates/tiza-tui", version = "0.0.1" }
tiza-mcp = { path = "crates/tiza-mcp", version = "0.0.1" }
tiza-export = { path = "crates/tiza-export", version = "0.0.1" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }

rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"

clap = { version = "4.6.7", features = ["derive"] }

base64 = "0.23.1"
# File watching for follow mode (t-011): notify 8.x stable (9 is still rc).
notify = "8.2.0"
proptest = "1.12.0"
insta = "1.49.0"
jsonschema = { version = "0.59.0", default-features = false }
# SVG → PNG: resvg (usvg + tiny-skia + fontdb). Fonts are embedded, so no system fonts are needed;
# `system-fonts` only adds the optional fallback for emoji/CJK.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Character coverage of the embedded faces (t-130): the SVG embeds only the faces it draws. Already in the tree through usvg:
# version tied to usvg's (resvg); never bumped alone — it moves in the commit that bumps resvg, `cargo tree -d` showing one skrifa (t-211).
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# Host appearance query (t-119): raw mode + timed read on /dev/tty before crossterm starts; already in the tree through crossterm:
# version tied to crossterm's; never bumped alone (t-211).
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "fs", "stdio"] }
# SIGHUP as a flag the event loop reads (t-205): the terminal went away, exit in order. Already in the tree through crossterm:
# version tied to crossterm's; never bumped alone (t-211).
signal-hook = "0.3.18"
# Theme override files (t-119): `~/.config/tiza/config.toml`, `--theme-file`. Parse only.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Animated GIF (t-120): encoder only, LZW through weezl; our own palette, no color_quant.
gif = { version = "0.14", default-features = false, features = ["std"] }


[profile.release]
# Fat LTO (t-133): -0.9 MB on macOS arm64 at the same speed. Keep the default
# panic = "unwind": a panic in a socket or MCP thread must fail that request
# only, never close the presenter's TUI (panic = "abort" was discarded).
# No opt-level = "s"/"z": measured 25 % to 2x slower.
lto = "fat"
codegen-units = 1
strip = true
