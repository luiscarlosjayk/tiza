[workspace]
resolver = "3"
members = [
    "crates/tiza-core",
    "crates/tiza-tui",
    "crates/tiza-mcp",
    "crates/tiza-cli",
    "crates/tiza-export",
    "qa",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luiscarlosjayk/tiza"
authors = ["Luis Carlos Osorio <luiscarlosjayk@gmail.com>", "Claude <noreply@anthropic.com>"]

[workspace.dependencies]
tiza-core = { path = "crates/tiza-core", version = "0.0.1" }
tiza-tui = { path = "crates/tiza-tui", version = "0.0.1" }
tiza-mcp = { path = "crates/tiza-mcp", version = "0.0.1" }
tiza-export = { path = "crates/tiza-export", version = "0.0.1" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
regex = "1.13"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }

rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

clap = { version = "4.6.7", features = ["derive"] }

base64 = "0.23.1"
# File watching for follow mode (t-011): notify 8.x stable (9 is still rc).
notify = "8.2.0"
proptest = "1.12.0"
insta = "1.49.0"
jsonschema = { version = "0.59.0", default-features = false }
# SVG → PNG: resvg (usvg + tiny-skia + fontdb). Fonts are embedded, so no system fonts are needed;
# `system-fonts` only adds the optional fallback for emoji/CJK.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Host appearance query (t-119): raw mode + timed read on /dev/tty before crossterm starts; already in the tree through crossterm.
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "fs"] }
# Theme override files (t-119): `~/.config/tiza/config.toml`, `--theme-file`. Parse only.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Animated GIF (t-120): encoder only, LZW through weezl; our own palette, no color_quant.
gif = { version = "0.14", default-features = false, features = ["std"] }


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
