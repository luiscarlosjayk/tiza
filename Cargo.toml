[workspace]
resolver = "3"
members = [
    "crates/codedraw-core",
    "crates/codedraw-tui",
    "crates/codedraw-mcp",
    "crates/codedraw-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luiscarlosjayk/codedraw"
authors = ["Luis Carlos Osorio <luiscarlosjayk@gmail.com>", "Claude <noreply@anthropic.com>"]

[workspace.dependencies]
codedraw-core = { path = "crates/codedraw-core", version = "0.0.1" }
codedraw-tui = { path = "crates/codedraw-tui", version = "0.0.1" }
codedraw-mcp = { path = "crates/codedraw-mcp", version = "0.0.1" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }

rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
