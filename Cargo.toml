[workspace]
resolver = "3"
members = [
    "crates/tiza-core",
    "crates/tiza-tui",
    "crates/tiza-mcp",
    "crates/tiza-cli",
    "crates/tiza-export",
    "qa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luiscarlosjayk/tiza"
authors = ["Luis Carlos Osorio Jayk <luiscarlosjayk@gmail.com>"]

[workspace.dependencies]
tiza-core = { path = "crates/tiza-core", version = "0.1.0" }
tiza-tui = { path = "crates/tiza-tui", version = "0.1.0" }
tiza-mcp = { path = "crates/tiza-mcp", version = "0.1.0" }
tiza-export = { path = "crates/tiza-export", version = "0.1.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }

rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"

clap = { version = "4.6.7", features = ["derive"] }

base64 = "0.23.1"
# File watching for follow mode: notify 8.x stable (9 is still rc).
notify = "8.2.0"
proptest = "1.12.0"
insta = "1.49.0"
jsonschema = { version = "0.59.0", default-features = false }
# SVG → PNG: resvg (usvg + tiny-skia + fontdb). Fonts are embedded, so no system fonts are needed;
# `system-fonts` only adds the optional fallback for emoji/CJK.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Character coverage of the embedded faces: the SVG embeds only the faces it draws. Already in the tree through usvg:
# version tied to usvg's (resvg); never bumped alone — it moves in the commit that bumps resvg, `cargo tree -d` showing one skrifa.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# Host appearance query: raw mode + timed read on /dev/tty before crossterm starts; already in the tree through crossterm:
# version tied to crossterm's; never bumped alone.
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "fs", "stdio", "process"] }
# SIGHUP as a flag the event loop reads: the terminal went away, exit in order. Already in the tree through crossterm:
# version tied to crossterm's; never bumped alone.
signal-hook = "0.3.18"
# Theme override files: `~/.config/tiza/config.toml`, `--theme-file`. Parse only.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Animated GIF: encoder only, LZW through weezl; our own palette, no color_quant.
gif = { version = "0.14", default-features = false, features = ["std"] }
# Lossless WebP, still and animated: libwebp 1.6 in C, built from source by its build script (a C compiler is
# needed). A pure Rust encoder makes code frames 2.9 times larger (no palette transform, no LZ77). Only in
# `tiza-export`, behind the safe API of `webp/mod.rs`; the license goes into the release archives.
# Exact version: a `cargo install` without --locked builds the same libwebp, so the same pixels give the same bytes.
# `std` is needed (it is a default, with `parallel`, which only speeds up the build): it builds libwebp with
# WEBP_USE_THREAD, so a lock guards its CPU setup when two exports run at once (`export_image` calls).
libwebp-sys = { version = "=0.14.4", features = ["std"] }
# Tests only: an independent WebP decoder, in Rust, that checks what libwebp writes.
image-webp = "0.2.4"
# Tests only: decodes the PNG exports to compare them with the WebP ones. Already in the tree through tiny-skia
# (resvg): version tied to it, never bumped alone.
png = "0.18.1"


# Every crate opts in with `[lints] workspace = true`. Only two places allow
# unsafe code: the libwebp module of tiza-export (`webp/ffi.rs`) and the
# `set_var` test of tiza-qa (`qa/tests/env/socket_dir_env.rs`).
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
# Fat LTO: -0.9 MB on macOS arm64 at the same speed. Keep the default
# panic = "unwind": a panic in a socket or MCP thread must fail that request
# only, never close the presenter's TUI (panic = "abort" was discarded).
# No opt-level = "s"/"z": measured 25 % to 2x slower.
lto = "fat"
codegen-units = 1
strip = true
