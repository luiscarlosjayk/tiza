name: Release

# Every vX.Y.Z tag publishes a GitHub Release with binaries for macOS (arm64, x86_64)
# and Linux (x86_64), checksums and notes generated from the commits.
# Tags with a suffix (-alpha.1, -rc.1) are marked as prerelease.
# crates.io is published by hand (README, "Releases (maintainers)").
# scripts/release-local.sh builds the same archives when Actions is off.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          # GitHub retired the Intel macos-13 image: the x86_64 build is
          # cross-compiled on the arm64 runner (same toolchain, extra target).
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml pins (the only place its version is
      # written; rustup >= 1.28 installs it with a bare `toolchain install`),
      # and the target added to that toolchain: with a separate `stable` the
      # target landed there and the x86_64-apple-darwin build had no std.
      - name: Rust toolchain (rust-toolchain.toml) and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p tiza
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="tiza-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/tiza" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r examples "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: release notes
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Tiza ${GITHUB_REF_NAME}"
            echo
            echo "Installation: download the tar.gz for your platform, verify the .sha256 and copy \`tiza\` into your PATH, or \`cargo install --git https://github.com/${GITHUB_REPOSITORY} tiza --tag ${GITHUB_REF_NAME}\`."
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then git log --no-merges --pretty='- %s (%h)' "$prev..${GITHUB_REF_NAME}"; else git log --no-merges --pretty='- %s (%h)'; fi
          } > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false

