name: Docs site

# Builds the docs site (site/, Zola) from README.md and docs/. site/build.sh
# also checks every link of the built site.
# The site describes the latest release. Only a release tag vX.Y.Z, with no
# suffix, deploys it to GitHub Pages: the owner pushes the tag. A manual run
# (workflow_dispatch) deploys the latest such tag again. A pull request or a
# push to main only builds and checks the site at that commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "README.md"
      - "Cargo.toml"
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "Cargo.toml"
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A deploy that runs goes to its end. A check of a
# pull request or of main has a group of its own, so it never waits for a
# deploy or cancels one.
concurrency:
  group: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'pages' || format('docs-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

env:
  ZOLA_VERSION: "0.23.6"
  # The sha256 digest of zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz in the
  # GitHub release API (the release has no checksum file). It was also
  # computed from a download, and the two are equal.
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.ref.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The manual run needs the tags to find the latest release.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      - name: Choose the ref that the site describes
        id: ref
        shell: bash
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$(git tag --list 'v*' --sort=-v:refname | grep -E "$stable" | head -n 1 || true)"
            if [ -z "$tag" ]; then
              echo "::error::no release tag vX.Y.Z yet: the site deploys from the first release"
              exit 1
            fi
            git checkout --quiet "refs/tags/$tag"
            ref="$tag" deploy=true
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            ref="$GITHUB_REF_NAME"
            if [[ "$ref" =~ $stable ]]; then deploy=true; else deploy=false; fi
          else
            ref=main deploy=false
          fi
          if [ ! -x site/build.sh ]; then
            echo "::error::$ref has no site/: the site deploys from the next release that has it"
            exit 1
          fi
          echo "The site describes $ref (deploy: $deploy)."
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Install Zola
        run: |
          archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          dl="$(mktemp -d "$RUNNER_TEMP/zola-dl.XXXXXX")"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dl/$archive" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/$archive"
          (cd "$dl" && echo "${ZOLA_SHA256}  $archive" | sha256sum -c -)
          bin="$(mktemp -d "$RUNNER_TEMP/zola-bin.XXXXXX")"
          tar -xzf "$dl/$archive" -C "$bin" zola
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/zola" --version
      - name: Build the site and check its links
        env:
          DOCS_REF: ${{ steps.ref.outputs.ref }}
        run: site/build.sh
      - uses: actions/upload-pages-artifact@v5
        if: steps.ref.outputs.deploy == 'true'
        with:
          path: site/public

  deploy:
    needs: build
    # Only a release tag vX.Y.Z or the manual run, and not in a fork.
    if: needs.build.outputs.deploy == 'true' && github.repository == 'luiscarlosjayk/tiza'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
