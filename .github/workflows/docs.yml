name: Docs site

# Builds the docs site (site/, Zola) from README.md and docs/ and deploys it to
# GitHub Pages. site/build.sh also checks every link of the built site.
# A pull request only builds the site. Only a push to main of this repository
# deploys it.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "Cargo.toml"
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "Cargo.toml"
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A deploy that runs goes to its end. A pull request
# has a group of its own, so it never waits for a deploy or cancels one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZOLA_VERSION: "0.23.6"
  # The sha256 digest of zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz in the
  # GitHub release API (the release has no checksum file). It was also
  # computed from a download, and the two are equal.
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola
        run: |
          archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          dl="$(mktemp -d "$RUNNER_TEMP/zola-dl.XXXXXX")"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dl/$archive" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/$archive"
          (cd "$dl" && echo "${ZOLA_SHA256}  $archive" | sha256sum -c -)
          bin="$(mktemp -d "$RUNNER_TEMP/zola-bin.XXXXXX")"
          tar -xzf "$dl/$archive" -C "$bin" zola
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/zola" --version
      - name: Build the site and check its links
        run: site/build.sh
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    needs: build
    # Not for a pull request, a fork or a dispatch on another branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'luiscarlosjayk/tiza'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
