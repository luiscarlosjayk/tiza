name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The toolchain is the one rust-toolchain.toml pins, with its components
      # (rustfmt, clippy): that file is the only place the version is written,
      # and a bare `rustup toolchain install` (rustup >= 1.28, on the runners)
      # installs what it says. Before the cache, which keys on rustc's version.
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        shell: bash
        # --no-fail-fast so one red test binary does not hide the others; the
        # log is kept for the two steps below.
        run: |
          set -o pipefail
          cargo test --all-features --no-fail-fast 2>&1 | tee test.log
      - name: Report failing tests
        # Failing test names and panics become annotations (readable from the
        # API and the PR without downloading logs), and the `failures:` block
        # is printed in full.
        if: failure()
        shell: bash
        # `head` reads files, not pipes: this shell has pipefail, and a writer
        # that `head` leaves behind fails with SIGPIPE and stops the step.
        run: |
          grep -E '^test .* FAILED$|panicked at' test.log | sort -u >failing.txt || true
          head -40 failing.txt | while IFS= read -r line; do
            echo "::error title=cargo test (${{ matrix.os }})::${line}"
          done
          echo "::group::failures (${{ matrix.os }})"
          awk '/^failures:$/{p=1} p{print} /^test result:/{p=0}' test.log >failures.txt
          head -400 failures.txt
          echo "::endgroup::"
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.os }}
          path: test.log
          retention-days: 7
      - name: smoke render
        run: cargo run -q -- render examples/ownership.rs.tiza --width 100 --step 5
      - name: smoke TUI (stdin piped, keys from /dev/tty)
        # `script` gives the job a pseudo-terminal; stdin stays a pipe, so
        # crossterm has to open /dev/tty (feature use-dev-tty). One frame, exit 0.
        shell: bash
        run: |
          cargo build -q
          if [ "$RUNNER_OS" = "macOS" ]; then
            script -q /dev/null bash -c 'cat examples/ownership.rs | ./target/debug/tiza --smoke --no-socket'
          else
            script -qec 'cat examples/ownership.rs | ./target/debug/tiza --smoke --no-socket' /dev/null
          fi

  schema:
    name: JSON Schema validates examples and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install jsonschema
      - run: python3 scripts/check-schema.py

  deny:
    name: cargo-deny (licenses, advisories, duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No toolchain step: the action's entrypoint runs `rustup show ||
      # rustup toolchain install` next to the manifest, so it installs and
      # uses the toolchain of rust-toolchain.toml too.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  legibility:
    name: legibility at 1080p after YouTube-like compression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pillow numpy
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: cargo build -q
      - name: last step of the example
        run: |
          python3 -c 'import json, sys
          d = json.load(open(sys.argv[1]))
          print("LAST=%d" % max([a.get("step", 0) for a in d.get("annotations", [])] + [m["at_step"] for m in d.get("moves", [])]))' examples/ownership.rs.tiza >> "$GITHUB_ENV"
      - name: dark theme, last step
        run: python3 scripts/legibility.py examples/ownership.rs.tiza --step "$LAST" --theme dark --json legibility-dark.json --keep frames-dark
      - name: light theme, last step
        run: python3 scripts/legibility.py examples/ownership.rs.tiza --step "$LAST" --theme light --json legibility-light.json --keep frames-light
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: legibility-report
          path: |
            legibility-*.json
            frames-*/after.png
          retention-days: 14
