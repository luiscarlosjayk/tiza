name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: smoke render
        run: cargo run -q -- render examples/ownership.rs.codedraw --width 100 --step 5
      - name: smoke TUI (stdin piped, keys from /dev/tty)
        # `script` gives the job a pseudo-terminal; stdin stays a pipe, so
        # crossterm has to open /dev/tty (feature use-dev-tty). One frame, exit 0.
        shell: bash
        run: |
          cargo build -q
          if [ "$RUNNER_OS" = "macOS" ]; then
            script -q /dev/null bash -c 'cat examples/ownership.rs | ./target/debug/codedraw --smoke --no-socket'
          else
            script -qec 'cat examples/ownership.rs | ./target/debug/codedraw --smoke --no-socket' /dev/null
          fi

  schema:
    name: JSON Schema validates examples and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install jsonschema
      - run: python3 scripts/check-schema.py

  deny:
    name: cargo-deny (licenses, advisories, duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
