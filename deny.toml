# cargo-deny: licencias permitidas, avisos de seguridad y duplicados.
# Política de dependencias: docs/adr/0004-dependencias.md

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # bincode 1.3.3 (vía syntect dump-load): su equipo lo declaró completo y cesó el desarrollo.
  # Solo lee las gramáticas precompiladas embebidas; no procesa datos externos. Revisar cuando syntect migre.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x solo para dumps embebidos de syntect; sin entrada externa" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
