# cargo-deny: allowed licenses, security advisories and duplicates.
# Dependency policy: docs/adr/0004-dependencias.md

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # bincode 1.3.3 (via syntect dump-load): its team declared it complete and stopped development.
  # It only reads the embedded precompiled grammars; it does not process external data. Revisit when syntect migrates.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x only for syntect embedded dumps; no external input" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "ISC",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
